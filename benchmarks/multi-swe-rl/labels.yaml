bulk:
- id: prime-multi-swe-rl
  benchmark: multi-swe-rl
  file: 'HF PrimeIntellect/Multi-SWE-RL-Verified: no-edit-pass-exclusions.jsonl, goldpatch-retest-exclusions.jsonl, validation.jsonl, validation-pass2.jsonl'
  rules:
  - file: no-edit-pass-exclusions.jsonl
    category: nop_passes
    expected_rules:
    - RG002
  - file: validation.jsonl
    where:
    - - reason
      - ==
      - gold_apply_failed
    category: gold_fails
    expected_rules:
    - RG001
    - RG009
  - file: goldpatch-retest-exclusions.jsonl
    category: flaky
    expected_rules:
    - RG003
    confidence: medium
  - file: validation-pass2.jsonl
    where:
    - - reward
      - <
      - 1
    category: flaky
    expected_rules:
    - RG003
    confidence: medium
  - file: validation.jsonl
    where:
    - - lang
      - ==
      - cpp
    category: broken_env
    expected_rules:
    - RG001
    - RG608
  - note: rows passing both gold passes and absent from every exclusion list are weak negatives
  source:
    org: Prime Intellect
    url: https://huggingface.co/collections/PrimeIntellect/swe-rl-6a4d7a3ada4336936bc08915
  count: 11 / 5 / 172 / 79 / 449
  url: https://huggingface.co/datasets/PrimeIntellect/Multi-SWE-RL-Verified
- id: mswe-70-future-commits
  benchmark: multi-swe-bench, multi-swe-rl
  file: (rule, no file)
  rules:
  - all: every image built before a rebuild (none announced)
    category: answer_leak
    expected_rules:
    - RG301
    confidence: medium
