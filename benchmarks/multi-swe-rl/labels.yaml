- HF ByteDance-Seed/Multi-SWE-RL data_20240601_20250331
- HF PrimeIntellect/Multi-SWE-RL-Verified
runnable_by_rlgate: partial
how_to_run: SWE-style rows in `<out>/multi-swe-rl/<benchmark>.jsonl`; needs a mapping YAML (`--layout file`) and the repo checked out per row
