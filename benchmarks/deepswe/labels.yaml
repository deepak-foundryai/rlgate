bulk:
- id: tokenless-findings
  benchmark: terminal-bench-4.0, deepswe (BFCL rows -> review_only)
  format: jsonl, cases[] with task/shows/sweep
  rules:
  - case_shows: incorrect submission, accepted
    category: weak_tests (defect.class verifier-state-writable-by-candidate / candidate-code-in-verifier-trust-domain -> forgeable_grader; answer-material-readable-by-candidate
      -> answer_leak)
    expected_rules:
    - RG110
    - RG111
    - RG210
    - RG212
  - case_shows: correct submission, rejected
    category: too_strict
    expected_rules:
    - RG408
  - case_shows: as intended
    polarity: negative (per case, not per task)
  - sweep_contains: bfcl
    skip: review_only.yaml
  source:
    org: Tokenless
    url: https://github.com/tokenless-ai/envcheck-findings/tree/post/2026-10-grader-defects
  count: 82 rows / 163 cases; 13 TB4 + 21 DeepSWE tasks
  url: https://github.com/tokenless-ai/envcheck-findings/tree/post/2026-10-grader-defects
  member: findings.jsonl
  licence: see repo - linked, not copied
