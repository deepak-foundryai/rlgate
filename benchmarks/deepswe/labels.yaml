# deepswe: published task-level flaw labels. See README.md and ../README.md.
benchmark: deepswe
description: DeepSWE (Datacurve) Harbor tasks with execution-confirmed grader defects (Tokenless) and reviewed false negatives (Epoch AI).
versions:
- deep-swe@0b9fabbb63b9
runnable_by_rlgate: 'yes'
how_to_run: '`rlgate check <out>/deepswe --layout deepswe -j 8`'
tasks:
- id: deepswe-aiomonitor-task-snapshots-diff
  benchmark: deepswe
  version: deep-swe@0b9fabbb63b9 (blog calls it v1.1; repo tags v1.0.0/v2.0.0)
  polarity: positive
  category: forgeable_grader
  label: a submitted pytest hook rewrites failing tests as passed for full reward; default capacity, stack frames, eviction and first snapshot
    id unchecked
  expected_rules:
  - RG201
  - RG211
  - RG110
  confidence: high
  source:
  - org: Tokenless
    url: https://github.com/tokenless-ai/envcheck-findings/tree/post/2026-10-grader-defects
