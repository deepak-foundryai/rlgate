# r2e-gym: published task-level flaw labels. See README.md and ../README.md.
benchmark: r2e-gym
description: 'R2E-Gym Subset: rows Prime Intellect dropped because the gold patch fails.'
versions:
- HF PrimeIntellect/R2E-Gym-Subset-Verified (split dropped)
runnable_by_rlgate: partial
how_to_run: SWE-style rows in `<out>/r2e-gym/<benchmark>.jsonl`; needs a mapping YAML (`--layout file`) and the repo checked out per row
datasets:
  r2e-gym-verified:
    hf: PrimeIntellect/R2E-Gym-Subset-Verified
    revision: main
    files:
    - data/dropped-*.parquet
    - data/train-*.parquet
    id_field: commit_hash
    image: '{docker_image}'
    approx_mb: 300
    image_gb: 2.0
    layout: yaml-needed
tasks:
- id: r2egym-006fbe03fede4eaa1eeba7b8393cbf4d63cb44b6
