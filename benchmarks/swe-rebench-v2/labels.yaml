# swe-rebench-v2: published task-level flaw labels. See README.md and ../README.md.
benchmark: swe-rebench-v2
description: 'SWE-rebench-V2 (Nebius): images that ship a newer release with the fix (HF #7), plus Prime Intellect''s per-row gold / no-op validation.'
versions:
- HF nebius/SWE-rebench-V2
- HF PrimeIntellect/SWE-rebench-V2-Filtered-Verified (validation files)
runnable_by_rlgate: partial
how_to_run: SWE-style rows in `<out>/swe-rebench-v2/<benchmark>.jsonl`; needs a mapping YAML (`--layout file`) and the repo checked out per row
datasets:
  swe-rebench-v2:
    hf: nebius/SWE-rebench-V2
    revision: main
    files:
    - data/*.parquet
    id_field: instance_id
    image: '{image_name}'
    approx_mb: 2200
    image_gb: 2.5
    layout: yaml-needed
    note: '2.2 GB parquet; short ids from HF #7 resolve by suffix match'
