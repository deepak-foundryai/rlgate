# openswe: published task-level flaw labels. See README.md and ../README.md.
benchmark: openswe
description: 'OpenSWE (GAIR, gated): eval scripts that paste the gold fix before running tests.'
versions:
- HF GAIR/OpenSWE (gated)
runnable_by_rlgate: partial
how_to_run: SWE-style rows in `<out>/openswe/<benchmark>.jsonl`; needs a mapping YAML (`--layout file`) and the repo checked out per row
datasets:
