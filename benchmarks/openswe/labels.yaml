    hf: GAIR/OpenSWE
    revision: main
    files:
    - openswe_other.jsonl
    - filtered_ids.csv
    id_field: instance_id
    image: (per-env Dockerfile in the row)
    approx_mb: 8360
    image_gb: 2.0
    layout: yaml-needed
    gated: true
    note: gated (accept terms); 8.36 GB
