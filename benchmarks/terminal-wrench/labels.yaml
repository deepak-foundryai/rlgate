# terminal-wrench: published task-level flaw labels. See README.md and ../README.md.
benchmark: terminal-wrench
description: 'Terminal Wrench: 331 tasks from TB2, terminal-bench-pro, SETA and others where a model got full reward with a hack. Entries here
  are the non-TB2 originals; TB2 ones are filed under terminal-bench-2.'
versions:
- terminal-wrench@d8a29613235a
runnable_by_rlgate: 'yes'
how_to_run: 'Harbor task dirs: `rlgate check <out>/terminal-wrench -j 8`'
