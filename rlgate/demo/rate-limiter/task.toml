# rlgate demo task: deliberately broken. `rlgate demo` checks it so you can see real findings.
schema_version = "1.0"

[task]
name = "rlgate/demo-rate-limiter"
description = "Cap the token bucket so an idle limiter can't release a burst above capacity."

[metadata]
category = "coding"
tags = ["python", "demo"]

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 600.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 1024
